<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#7c2d12">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SVR Tracker">
<title>SVR Daily Tracker</title>
<style>
  :root { --brand:#7c2d12; --bg:#f4f5f7; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:'Segoe UI',system-ui,Arial,sans-serif; background:var(--bg); color:#222; }
  header { background:var(--brand); color:#fff; padding:14px 16px; padding-top:calc(14px + env(safe-area-inset-top)); }
  header .t { font-size:19px; font-weight:800; }
  header .s { font-size:13px; color:#ffd9c2; margin-top:2px; }
  .wrap { padding:14px; max-width:520px; margin:auto; padding-bottom:80px; }
  .card { background:#fff; border-radius:12px; padding:14px; margin-bottom:14px;
          box-shadow:0 2px 6px rgba(0,0,0,.07); border-top:4px solid transparent; }
  .card.att { border-top-color:#0369a1; } .card.gas { border-top-color:#ea580c; }
  .card.eb  { border-top-color:#16a34a; }
  .sec { font-size:17px; font-weight:700; margin-bottom:6px; }
  label { display:block; font-size:13px; color:#555; margin:10px 0 3px; }
  input { width:100%; border:1.4px solid #cbd5e1; border-radius:9px; padding:12px;
          font-size:19px; background:#fbfbfb; }
  input:focus { outline:2px solid var(--brand); }
  .row { display:flex; gap:10px; } .row > div { flex:1; }
  .bigbtn { width:100%; background:var(--brand); color:#fff; border:none; border-radius:12px;
            padding:16px; font-size:17px; font-weight:800; letter-spacing:.5px; margin-top:8px; cursor:pointer; }
  .bigbtn.blue { background:#0369a1; }
  .bigbtn:disabled { opacity:.6; }
  .warn { color:#b45309; font-weight:600; font-size:14px; margin-top:8px; }
  .cons { margin-top:10px; font-size:16px; font-weight:700; color:#14532d; }
  .cons.neg { color:#b91c1c; }
  .hint { font-size:12.5px; color:#777; text-align:center; margin-top:10px; }
  .banner { padding:9px; text-align:center; color:#fff; font-size:13.5px; display:none; }
  .banner.off { background:#7f1d1d; display:block; }
  .banner.pend { background:#b45309; display:block; cursor:pointer; font-weight:600; }
  .done { text-align:center; padding:26px 14px; }
  .done .big { font-size:48px; } .done .msg { font-size:19px; font-weight:700; color:#14532d; margin:8px 0 4px; }
  .link { color:#0369a1; font-size:14px; text-decoration:underline; cursor:pointer; }
  .center { text-align:center; }
  #loading { text-align:center; padding:60px 20px; color:#666; }
  .brandtop { text-align:center; margin:34px 0 16px; }
  .brandtop .b1 { font-size:27px; font-weight:800; color:var(--brand); }
  .brandtop .b2 { font-size:14.5px; color:#666; }
</style>
</head>
<body>

<div id="app"><div id="loading">Loading…</div></div>

<script>
// ================= CONFIG =================
var API = 'https://script.google.com/macros/s/AKfycbzHAQxit9t7djfxG1KXSklYJshq6pwFm7r3g0vMFh9AFeHixG8hR_zTl5595IrlJmrrrw/exec';
// ==========================================

var S = {
  code: localStorage.getItem('code') || '',
  outlet: localStorage.getItem('outlet') || '',
  person: localStorage.getItem('person') || '',
  mobile: localStorage.getItem('mobile') || '',
  config: JSON.parse(localStorage.getItem('config') || 'null'),
  lastClosings: JSON.parse(localStorage.getItem('lastClosings') || 'null'),
  doneDate: localStorage.getItem('doneDate') || '',
  pending: JSON.parse(localStorage.getItem('pending') || '[]'),
  online: true, editing: false, form: null
};

function save(k, v) { localStorage.setItem(k, typeof v === 'string' ? v : JSON.stringify(v)); }
function today() {
  var d = new Date(); 
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function num(v) { var n = parseFloat(String(v).replace(',', '.')); return isNaN(n) ? 0 : n; }
function esc(s) { return String(s).replace(/[&<>"]/g, function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }

function apiGet(params) {
  var q = Object.keys(params).map(function(k){ return k + '=' + encodeURIComponent(params[k]); }).join('&');
  return fetch(API + '?' + q).then(function(r){ return r.json(); });
}
function apiPost(body) {
  return fetch(API, { method:'POST', body: JSON.stringify(body) }).then(function(r){ return r.json(); });
}

// ================= VIEWS =================
function render(html) { document.getElementById('app').innerHTML = html; }

function showSetup(msg) {
  render(
    '<div class="wrap">' +
    '<div class="brandtop"><div class="b1">🏪 SVR Sangeetha</div><div class="b2">Daily Tracker — One-time Setup</div></div>' +
    '<div class="card">' +
    (msg ? '<p class="warn">' + esc(msg) + '</p>' : '') +
    '<label>Outlet Activation Code (from admin)</label>' +
    '<input id="i-code" autocapitalize="characters" placeholder="e.g. RAMA-4110" value="' + esc(S.code) + '">' +
    '<label>Your Name</label>' +
    '<input id="i-person" placeholder="e.g. Kumar" value="' + esc(S.person) + '">' +
    '<label>Your Mobile Number</label>' +
    '<input id="i-mobile" inputmode="numeric" maxlength="10" placeholder="10-digit number" value="' + esc(S.mobile) + '">' +
    '<button class="bigbtn" onclick="doActivate()">ACTIVATE THIS PHONE</button>' +
    '<p class="hint">Do this only once. Afterwards the app opens directly to your outlet\'s daily form.</p>' +
    '</div></div>');
}

function doActivate() {
  var code = document.getElementById('i-code').value.trim().toUpperCase();
  var person = document.getElementById('i-person').value.trim();
  var mobile = document.getElementById('i-mobile').value.trim();
  if (!code || !person || mobile.length < 10) { alert('Enter outlet code, your name and 10-digit mobile number.'); return; }
  render('<div id="loading">Activating…</div>');
  apiPost({ action:'activate', code:code, person:person, mobile:mobile }).then(function(j) {
    if (!j.ok) { showSetup(j.error || 'Activation failed'); return; }
    S.code = code; S.outlet = j.outlet; S.person = person; S.mobile = mobile; S.config = j.config;
    save('code', code); save('outlet', j.outlet); save('person', person);
    save('mobile', mobile); save('config', j.config);
    alert('✅ Activated!\nThis phone is now linked to ' + j.outlet + ' outlet.');
    loadDay();
  }).catch(function() {
    showSetup('Cannot reach server. Check your internet connection and try again.');
  });
}

function changePerson() {
  var p = prompt('Enter your name:', S.person);
  if (!p) return;
  var m = prompt('Enter your mobile number:', S.mobile);
  if (!m || m.trim().length < 10) { alert('Valid 10-digit mobile needed'); return; }
  S.person = p.trim(); S.mobile = m.trim();
  save('person', S.person); save('mobile', S.mobile);
  loadDay();
}

// ================= DAILY FORM =================
function loadDay() {
  render('<div id="loading">Loading today\'s form…</div>');
  var d = today();
  apiGet({ action:'dayform', code:S.code, date:d }).then(function(j) {
    if (!j.ok) {
      if (j.error === 'code_revoked') { clearReg('This code was removed by admin. Ask for a new code.'); return; }
      throw new Error(j.error);
    }
    S.online = true;
    S.config = j.config; save('config', j.config);
    S.form = buildFormState(j.config, j.previous, j.existing);
    S.submittedToday = !!j.existing;
    drawDay(d);
    trySync();
  }).catch(function() {
    S.online = false;
    if (!S.config) {
      render('<div class="wrap center" style="padding-top:80px"><p>Cannot reach server and no saved form on this phone yet.<br><br>Check internet and retry.</p>' +
        '<button class="bigbtn" onclick="loadDay()">RETRY</button></div>');
      return;
    }
    var prev = { gas: [], eb: [] };
    if (S.lastClosings) prev = S.lastClosings;
    S.form = buildFormState(S.config, prev, null);
    S.submittedToday = (S.doneDate === today());
    drawDay(today());
  });
}

function buildFormState(cfg, previous, existing) {
  var f = { att: { total:'', present:'', absent:'', dayoff:'' }, gas: [], eb: [] };
  cfg.gas.forEach(function(g, i) {
    var prevClose = previous && previous.gas && previous.gas[i] != null ? previous.gas[i] : '';
    f.gas.push({ opening: String(prevClose), purchase: '0', extra: '0', closing: '' });
  });
  cfg.eb.forEach(function(e, i) {
    var prevClose = previous && previous.eb && previous.eb[i] != null ? previous.eb[i] : '';
    f.eb.push({ opening: String(prevClose), closing: '' });
  });
  if (existing) {
    f.att = { total: existing.attendance.total, present: existing.attendance.present,
              absent: existing.attendance.absent, dayoff: existing.attendance.dayoff };
    existing.gas.forEach(function(g, i) {
      if (f.gas[i]) f.gas[i] = { opening: String(g.opening), purchase: String(g.purchase),
                                 extra: String(g.extra != null ? g.extra : 0), closing: String(g.closing) };
    });
    existing.eb.forEach(function(e, i) {
      if (f.eb[i]) f.eb[i] = { opening: String(e.opening), closing: String(e.closing) };
    });
  }
  return f;
}

function drawDay(d) {
  var h = '<header><div class="t">🏪 ' + esc(S.outlet) + '</div>' +
          '<div class="s">' + esc(S.person) + ' • ' + d + ' • <span class="link" style="color:#ffd9c2" onclick="changePerson()">change person</span></div></header>';
  h += '<div class="banner off" id="offbar" style="display:' + (S.online ? 'none' : 'block') + '">📴 Server offline — entry will be saved on phone & sent later</div>';
  h += '<div class="banner pend" id="pendbar" onclick="trySync(true)" style="display:' + (S.pending.length ? 'block' : 'none') + '">⏳ ' + S.pending.length + ' entry waiting to sync — tap to retry</div>';
  h += '<div class="wrap">';

  if (S.submittedToday && !S.editing) {
    h += '<div class="card done"><div class="big">✅</div><div class="msg">Today\'s entry submitted</div>' +
         '<div style="color:#555">' + esc(S.outlet) + ' — ' + d + '</div>' +
         '<button class="bigbtn blue" onclick="S.editing=true;drawDay(\'' + d + '\')">EDIT TODAY\'S ENTRY</button></div>';
  } else {
    h += attCard() + gasCards() + ebCards();
    h += '<button class="bigbtn" id="submitbtn" onclick="doSubmit()">' + (S.editing ? 'UPDATE ENTRY' : 'SUBMIT TODAY\'S ENTRY') + '</button>';
    if (S.editing) h += '<p class="center" style="margin-top:12px"><span class="link" onclick="S.editing=false;loadDay()">Cancel edit</span></p>';
  }
  h += '</div>';
  render(h);
}

function attCard() {
  var a = S.form.att;
  return '<div class="card att"><div class="sec">👥 Attendance</div>' +
    '<div class="row"><div><label>Total staff</label><input inputmode="numeric" value="' + esc(a.total) + '" oninput="upd(\'att\',0,\'total\',this.value)"></div>' +
    '<div><label>Present</label><input inputmode="numeric" value="' + esc(a.present) + '" oninput="upd(\'att\',0,\'present\',this.value)"></div></div>' +
    '<div class="row"><div><label>Absent</label><input inputmode="numeric" value="' + esc(a.absent) + '" oninput="upd(\'att\',0,\'absent\',this.value)"></div>' +
    '<div><label>Day off</label><input inputmode="numeric" value="' + esc(a.dayoff) + '" oninput="upd(\'att\',0,\'dayoff\',this.value)"></div></div>' +
    '<div class="warn" id="attwarn" style="display:none">⚠️ Present + Absent + Day off must equal Total</div></div>';
}

function gasCards() {
  var h = '';
  S.config.gas.forEach(function(g, i) {
    var v = S.form.gas[i];
    h += '<div class="card gas"><div class="sec">🔥 ' + esc(g.name) + '</div>' +
      '<div class="row"><div><label>Opening (auto)</label><input inputmode="decimal" value="' + esc(v.opening) + '" oninput="upd(\'gas\',' + i + ',\'opening\',this.value)"></div>' +
      '<div><label>Purchased today</label><input inputmode="decimal" value="' + esc(v.purchase) + '" oninput="upd(\'gas\',' + i + ',\'purchase\',this.value)"></div></div>' +
      '<div class="row">' +
      (g.extra ? '<div><label>' + esc(g.extra) + '</label><input inputmode="decimal" value="' + esc(v.extra) + '" oninput="upd(\'gas\',' + i + ',\'extra\',this.value)"></div>' : '<div></div>') +
      '<div><label>Closing count</label><input inputmode="decimal" value="' + esc(v.closing) + '" oninput="upd(\'gas\',' + i + ',\'closing\',this.value)"></div></div>' +
      '<div class="cons" id="gascons' + i + '"></div></div>';
  });
  return h;
}

function ebCards() {
  var h = '';
  S.config.eb.forEach(function(e, i) {
    var v = S.form.eb[i];
    h += '<div class="card eb"><div class="sec">⚡ ' + esc(e.name) + (e.mult != 1 ? ' (×' + e.mult + ')' : '') + '</div>' +
      '<div class="row"><div><label>Opening (auto)</label><input inputmode="decimal" value="' + esc(v.opening) + '" oninput="upd(\'eb\',' + i + ',\'opening\',this.value)"></div>' +
      '<div><label>Today\'s reading</label><input inputmode="decimal" value="' + esc(v.closing) + '" oninput="upd(\'eb\',' + i + ',\'closing\',this.value)"></div></div>' +
      '<div class="cons" id="ebcons' + i + '"></div></div>';
  });
  return h;
}

function upd(kind, i, field, val) {
  if (kind === 'att') S.form.att[field] = val;
  else S.form[kind][i][field] = val;
  refreshCalcs();
}

function refreshCalcs() {
  var a = S.form.att;
  var bad = a.total !== '' && (num(a.total) !== num(a.present) + num(a.absent) + num(a.dayoff));
  var w = document.getElementById('attwarn');
  if (w) w.style.display = bad ? 'block' : 'none';
  S.config.gas.forEach(function(g, i) {
    var v = S.form.gas[i];
    var el = document.getElementById('gascons' + i);
    if (!el) return;
    if (v.closing === '') { el.textContent = 'Consumption: —'; el.className = 'cons'; return; }
    var c = num(v.opening) + num(v.purchase) - num(v.closing);
    el.textContent = 'Consumption: ' + Math.round(c * 100) / 100;
    el.className = c < 0 ? 'cons neg' : 'cons';
  });
  S.config.eb.forEach(function(e, i) {
    var v = S.form.eb[i];
    var el = document.getElementById('ebcons' + i);
    if (!el) return;
    if (v.closing === '') { el.textContent = 'Units used: —'; el.className = 'cons'; return; }
    var c = num(v.closing) - num(v.opening);
    var t = 'Units used: ' + Math.round(c * 10) / 10;
    if (e.mult != 1) t += '  →  ' + Math.round(c * e.mult * 10) / 10 + ' (×' + e.mult + ')';
    el.textContent = t;
    el.className = c < 0 ? 'cons neg' : 'cons';
  });
}

// ================= SUBMIT =================
function doSubmit() {
  var a = S.form.att;
  if (a.total === '' || a.present === '' || a.absent === '' || a.dayoff === '') { alert('Fill all attendance fields.'); return; }
  if (num(a.total) !== num(a.present) + num(a.absent) + num(a.dayoff)) {
    alert('Attendance mismatch:\nPresent + Absent + Day off must equal Total staff.'); return;
  }
  for (var i = 0; i < S.config.gas.length; i++) {
    if (S.form.gas[i].opening === '' || S.form.gas[i].closing === '') { alert('Enter opening & closing for "' + S.config.gas[i].name + '".'); return; }
  }
  for (var j = 0; j < S.config.eb.length; j++) {
    if (S.form.eb[j].opening === '' || S.form.eb[j].closing === '') { alert('Enter reading for "' + S.config.eb[j].name + '".'); return; }
  }
  var negs = [];
  S.config.gas.forEach(function(g, i) {
    var v = S.form.gas[i];
    if (num(v.opening) + num(v.purchase) - num(v.closing) < 0) negs.push(g.name);
  });
  S.config.eb.forEach(function(e, i) {
    var v = S.form.eb[i];
    if (num(v.closing) - num(v.opening) < 0) negs.push(e.name);
  });
  if (negs.length && !confirm('⚠️ Consumption is NEGATIVE for: ' + negs.join(', ') + '\n\nSubmit anyway?')) return;
  sendNow();
}

function payload() {
  return {
    action: 'submit', code: S.code, person: S.person, mobile: S.mobile, date: today(),
    attendance: { total: num(S.form.att.total), present: num(S.form.att.present),
                  absent: num(S.form.att.absent), dayoff: num(S.form.att.dayoff) },
    gas: S.form.gas.map(function(v) { return { opening: num(v.opening), purchase: num(v.purchase), extra: num(v.extra), closing: num(v.closing) }; }),
    eb: S.form.eb.map(function(v) { return { opening: num(v.opening), closing: num(v.closing) }; })
  };
}

function sendNow() {
  var btn = document.getElementById('submitbtn');
  if (btn) { btn.disabled = true; btn.textContent = 'Sending…'; }
  var p = payload();
  S.lastClosings = { gas: p.gas.map(function(g){ return g.closing; }), eb: p.eb.map(function(e){ return e.closing; }) };
  save('lastClosings', S.lastClosings);
  S.doneDate = p.date; save('doneDate', p.date);
  apiPost(p).then(function(j) {
    if (!j.ok) {
      if (j.error === 'code_revoked') { clearReg('This code was removed by admin.'); return; }
      throw new Error(j.error);
    }
    S.online = true; S.submittedToday = true; S.editing = false;
    alert('✅ Submitted!\nToday\'s entry saved for ' + S.outlet + '.');
    drawDay(p.date);
  }).catch(function() {
    S.pending = S.pending.filter(function(it){ return it.date !== p.date; });
    S.pending.push(p);
    save('pending', S.pending);
    S.online = false; S.submittedToday = true; S.editing = false;
    alert('📴 Saved on phone.\nServer not reachable now. Your entry will be sent automatically when connection is back.');
    drawDay(p.date);
  });
}

function trySync(manual) {
  if (!S.pending.length) return;
  var item = S.pending[0];
  apiPost(item).then(function(j) {
    if (j.ok || j.error === 'code_revoked') {
      S.pending.shift(); save('pending', S.pending);
      var bar = document.getElementById('pendbar');
      if (S.pending.length) { if (bar) bar.textContent = '⏳ ' + S.pending.length + ' entry waiting to sync — tap to retry'; trySync(); }
      else { if (bar) bar.style.display = 'none'; if (manual) alert('✅ Synced to server.'); }
    }
  }).catch(function(){ /* still offline */ });
}
setInterval(trySync, 30000);

function clearReg(msg) {
  localStorage.removeItem('code'); localStorage.removeItem('outlet'); localStorage.removeItem('config');
  S.code = ''; S.outlet = ''; S.config = null;
  showSetup(msg);
}

// ================= BOOT =================
if (S.code && S.outlet) loadDay(); else showSetup();
</script>
</body>
</html>
