<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SVR Daily Tracker — Dashboard</title>
<style>
  body { margin:0; font-family:'Segoe UI',Arial,sans-serif; background:#f4f5f7; color:#222; }
  header { background:#7c2d12; color:#fff; padding:12px 18px; display:flex; gap:16px; align-items:center; flex-wrap:wrap; }
  header .t { font-size:18px; font-weight:700; }
  header a { color:#ffd9c2; text-decoration:none; font-weight:600; cursor:pointer; }
  .wrap { padding:16px; max-width:1300px; margin:auto; }
  .card { background:#fff; border:1px solid #e2e2e2; border-radius:8px; padding:14px; margin-bottom:14px; }
  table { border-collapse:collapse; background:#fff; width:100%; }
  th, td { border:1px solid #ddd; padding:5px 7px; font-size:13px; text-align:center; }
  th { background:#fbe9e0; position:sticky; top:0; }
  .ok { background:#d1f5d3; } .miss { background:#ffd6d6; } .fut { background:#f0f0f0; color:#aaa; }
  .left { text-align:left; }
  .btn { background:#7c2d12; color:#fff; border:none; padding:7px 14px; border-radius:6px; cursor:pointer; font-size:13px; }
  input, select { padding:7px; border:1px solid #ccc; border-radius:5px; font-size:14px; }
  .chip { display:inline-block; background:#eee; border-radius:12px; padding:2px 10px; margin:2px; font-size:12px; }
  .late { color:#b45309; font-weight:700; }
  #loginbox { max-width:330px; margin:110px auto; }
  .scroll { overflow-x:auto; }
</style>
</head>
<body>
<div id="app"></div>

<script>
// ================= CONFIG =================
var API = 'https://script.google.com/macros/s/AKfycbzHAQxit9t7djfxG1KXSklYJshq6pwFm7r3g0vMFh9AFeHixG8hR_zTl5595IrlJmrrrw/exec';
// ==========================================

var PIN = localStorage.getItem('adminpin') || '';

function apiGet(params) {
  var q = Object.keys(params).map(function(k){ return k + '=' + encodeURIComponent(params[k]); }).join('&');
  return fetch(API + '?' + q).then(function(r){ return r.json(); });
}
function esc(s){ return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
function render(h){ document.getElementById('app').innerHTML = h; }
function monthNow(){ var d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); }
function todayStr(){ var d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }

function showLogin(msg) {
  render('<div id="loginbox" class="card"><h3>Dashboard Login</h3>' +
    (msg ? '<p style="color:red">'+esc(msg)+'</p>' : '') +
    '<input type="password" id="pin" placeholder="PIN" style="width:95%"><br><br>' +
    '<button class="btn" onclick="doLogin()">Enter</button></div>');
}
function doLogin() {
  PIN = document.getElementById('pin').value.trim();
  localStorage.setItem('adminpin', PIN);
  loadGrid(monthNow());
}
function logout(){ localStorage.removeItem('adminpin'); PIN=''; showLogin(); }

function nav(active) {
  return '<header><span class="t">🏪 SVR Daily Tracker — Admin</span>' +
    '<a onclick="loadGrid(monthNow())">Dashboard</a>' +
    '<a onclick="loadLog()">Submission Log</a>' +
    '<a onclick="logout()">Logout</a></header>';
}

// ================= GRID =================
function loadGrid(month) {
  render(nav() + '<div class="wrap"><p>Loading…</p></div>');
  apiGet({ action:'status', pin:PIN, month:month }).then(function(j) {
    if (!j.ok) { showLogin(j.error === 'wrong pin' ? 'Wrong PIN' : j.error); return; }
    drawGrid(j);
  }).catch(function(){ render(nav() + '<div class="wrap"><p>Cannot reach server. Refresh to retry.</p></div>'); });
}

function drawGrid(j) {
  var parts = j.month.split('-'); var y = +parts[0], m = +parts[1];
  var ndays = new Date(y, m, 0).getDate();
  var today = todayStr();
  var h = nav() + '<div class="wrap"><div class="card">' +
    'Month: <input type="month" id="mon" value="' + j.month + '"> ' +
    '<button class="btn" onclick="loadGrid(document.getElementById(\'mon\').value)">Show</button> ' +
    '<span class="chip">✓ submitted</span><span class="chip">✗ missing</span>' +
    ' <span class="chip">Hover a ✓ for person & time</span></div><div class="scroll"><table><tr><th class="left">Outlet</th>';
  for (var d = 1; d <= ndays; d++) h += '<th>' + d + '</th>';
  h += '<th>Done</th></tr>';
  j.outlets.forEach(function(o) {
    var done = 0, possible = 0;
    h += '<tr><td class="left"><b>' + esc(o) + '</b></td>';
    for (var d = 1; d <= ndays; d++) {
      var ds = j.month + '-' + String(d).padStart(2, '0');
      if (ds > today) { h += '<td class="fut">·</td>'; continue; }
      possible++;
      var cell = j.grid[o] && j.grid[o][ds];
      if (cell) { done++; h += '<td class="ok" title="' + esc(cell.person) + ' @ ' + esc(cell.at) + '">✓</td>'; }
      else h += '<td class="miss">✗</td>';
    }
    h += '<td><b>' + done + '/' + possible + '</b></td></tr>';
  });
  h += '</table></div>' +
    '<p style="font-size:13px;color:#555;margin-top:10px">Full data lives in the Google Sheet — open it for outlet-wise date rows (your report format), and manage codes / outlet setup in its Codes and Config tabs.</p></div>';
  render(h);
}

// ================= LOG =================
function loadLog() {
  render(nav() + '<div class="wrap"><p>Loading…</p></div>');
  apiGet({ action:'log', pin:PIN }).then(function(j) {
    if (!j.ok) { showLogin(j.error === 'wrong pin' ? 'Wrong PIN' : j.error); return; }
    var h = nav() + '<div class="wrap"><div class="card"><h3>Submission Log — latest 300, newest first</h3>' +
      '<p style="font-size:13px;color:#555"><b class="late">(late)</b> = submitted after 12 noon or on a later day than the entry date.</p></div>' +
      '<table><tr><th>Entry Date</th><th>Outlet</th><th>Person</th><th>Mobile</th><th>Submitted At</th><th>Action</th></tr>';
    j.entries.forEach(function(e) {
      var late = '';
      if (e.at) {
        var ad = e.at.substring(0, 10), at = e.at.substring(11, 16);
        if (ad > e.date || (ad === e.date && at > '12:00')) late = ' <span class="late">(late)</span>';
      }
      h += '<tr><td>' + esc(e.date) + '</td><td class="left"><b>' + esc(e.outlet) + '</b></td><td>' + esc(e.person) +
           '</td><td>' + esc(e.mobile) + '</td><td>' + esc(e.at) + late + '</td><td>' + esc(e.action) + '</td></tr>';
    });
    h += '</table></div>';
    render(h);
  });
}

// ================= BOOT =================
if (PIN) loadGrid(monthNow()); else showLogin();
</script>
</body>
</html>
